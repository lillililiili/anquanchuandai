name: melhat

services:
  mysql:
    image: mysql:8.0
    container_name: melhat-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: melhat
      MYSQL_DATABASE: melhat_local
      MYSQL_CHARSET: utf8mb4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --max_allowed_packet=64M
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d:ro
      - ../后端代码/melhat_server-dev/sql:/project-sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pmelhat", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: melhat-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: maven:3.9.9-eclipse-temurin-17
    container_name: melhat-backend
    restart: unless-stopped
    working_dir: /workspace
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      MAVEN_OPTS: -Xms256m -Xmx1024m
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/config/application.yml
      DB_PASSWORD: melhat
      JWT_SECRET: local-docker-jwt-secret
      MELHAT_CALLBACK_TOKEN: local-docker-callback
      MELHAT_CALL_LAB_ENABLED: "true"
      MELHAT_CALL_LAB_UPSTREAM_BASE_URL: http://host.docker.internal:5188
    ports:
      - "18084:18084"
    volumes:
      - ../后端代码/melhat_server-dev:/workspace
      - ./backend/application.yml:/config/application.yml:ro
      - ./backend/settings.xml:/root/.m2/settings.xml:ro
      - ./backend/start.sh:/opt/start.sh:ro
      - maven-repo:/root/.m2/repository
      - backend-upload:/data
      - target-admin:/workspace/ruoyi-admin/target
      - target-common:/workspace/ruoyi-common/target
      - target-framework:/workspace/ruoyi-framework/target
      - target-system:/workspace/ruoyi-system/target
      - target-quartz:/workspace/ruoyi-quartz/target
      - target-generator:/workspace/ruoyi-generator/target
    command: ["bash", "-lc", "cp /opt/start.sh /tmp/start.sh && sed -i 's/\\r$//' /tmp/start.sh && exec bash /tmp/start.sh"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/18084'"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 600s

  pc:
    image: node:22-bookworm
    container_name: melhat-pc
    restart: unless-stopped
    working_dir: /app
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=2048
      VITE_DEV_PORT: "5175"
      VITE_PROXY_TARGET: http://backend:18084
      VITE_APP_BASE_API: /dev-api
      VITE_APP_SOCKET_URL: ws://127.0.0.1:18084
      NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
    ports:
      - "5175:5175"
    volumes:
      - ../pc前端代码/melhat_pc-main:/app
      - ./pc/start.sh:/opt/start.sh:ro
      - pc-node-modules:/app/node_modules
      - pc-dist:/app/dist
    command: ["bash", "-lc", "cp /opt/start.sh /tmp/start.sh && sed -i 's/\\r$//' /tmp/start.sh && exec bash /tmp/start.sh"]

volumes:
  mysql-data:
  redis-data:
  maven-repo:
  backend-upload:
  pc-node-modules:
  pc-dist:
  target-admin:
  target-common:
  target-framework:
  target-system:
  target-quartz:
  target-generator:
