server:
  port: 18084

logging:
  level:
    root: warn
    com.ruoyi: info
    org.springframework: warn
    org.mybatis: warn
    org.apache.ibatis: warn

ruoyi:
  profile: /data/upload
  hatfile: /data/hatfile
  taskPackageFile: /data/taskPackage

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 102MB
  datasource:
    druid:
      master:
        url: jdbc:mysql://mysql:3306/melhat_local?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8&allowMultiQueries=true&nullCatalogMeansCurrent=true
        username: root
        password: ${DB_PASSWORD:melhat}
  redis:
    host: redis
    port: 6379
    database: 0
    password:

melhat:
  demo-mode: true
  call-lab:
    enabled: true
    upstream-base-url: ${MELHAT_CALL_LAB_UPSTREAM_BASE_URL:http://host.docker.internal:5188}
  download:
    allow-private-network: true
  callback:
    token: ${MELHAT_CALLBACK_TOKEN:local-docker-callback}

token:
  secret: ${JWT_SECRET:local-docker-jwt-secret}
  expireTime: 99999
