name: voice_recognizer
description: 基于阿里 Paraformer-zh 模型的离线语音识别组件，长按录音交互。
version: 1.0.3
homepage: https://github.com/symboy/voice_recognizer
repository: https://github.com/symboy/voice_recognizer

topics:
  - speech-recognition
  - voice-input
  - paraformer
  - offline-asr

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  sherpa_onnx: ^1.12.23
  record: ^6.2.0
  permission_handler: ^11.4.0
  path_provider: ^2.1.4
  lpinyin: ^2.0.3 # 汉字转拼音
  http: ^1.2.0 # 模型文件下载

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
