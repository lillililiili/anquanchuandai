<!doctype html>
<html lang="zh-CN"><head><base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>ROLLING · 巡检工人端页面设计</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eaf2fa;color:#152449;font-family:Arial,"Microsoft YaHei",sans-serif}body{display:flex;align-items:center;justify-content:center}.phone{width:408px;height:900px;position:relative;flex:none;overflow:hidden;box-shadow:0 18px 65px #345a7a30;background:#eff6fd}.status{height:48px;padding:3px 16px;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#59666c;background:#edf4f9}#app{width:408px;height:852px;position:relative}#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:12px;background:#edf6fe}#loading b{color:#307cff;font-size:24px}.guide{position:fixed;left:30px;top:30px;width:230px;font-size:14px;line-height:1.8}.guide strong{font-size:20px}.guide p{color:#607290}.guide button{padding:9px 16px;background:white;border:1px solid #d2dfea;border-radius:8px;color:#24529a;cursor:pointer}@media(max-width:950px){.guide{display:none}}
.preview-back{display:inline-flex;align-items:center;gap:4px;min-width:72px;min-height:40px;padding:6px 10px;border:1px solid #cadcf1;border-radius:10px;background:#fff;color:#24529a;font:600 14px Arial,"Microsoft YaHei",sans-serif;cursor:pointer}.preview-back:focus-visible{outline:3px solid #307cff;outline-offset:2px}.preview-back:hover{background:#e2efff}.preview-back:active{background:#d1e5ff}</style><link rel="stylesheet" href="events.css"></head><body>
<aside class="guide"><button onclick="location.hash='/login';location.reload()">重新体验登录</button></aside>
<main class="phone" id="phone"><div class="status"><button class="preview-back" type="button" aria-label="返回上一页" title="返回上一页或关闭当前弹层" onclick="window.dispatchEvent(new Event('rolling-preview-back'))"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 5-7 7 7 7"/></svg>返回</button><span>10:42</span><svg aria-label="信号及电量示意" width="43" height="16" viewBox="0 0 43 16" fill="currentColor"><path d="M1 12h3v3H1zm5-4h3v7H6zm5-4h3v11h-3zm5-4h3v15h-3z"/><rect x="27" y="3" width="13" height="11" rx="2" fill="none" stroke="currentColor"/><path d="M40 6h2v5h-2zM29 5h9v7h-9z"/></svg></div><div id="app"><div id="loading"><b>ROLLING</b><span>正在打开安卓展示页面…</span></div></div></main>
<script>
function fit(){const s=Math.min(innerWidth/408,(innerHeight-(innerWidth>600?40:0))/900);document.querySelector('#phone').style.transform=`scale(${s})`;}
addEventListener('resize',fit);fit();
if(location.protocol==='file:'){document.querySelector('#loading').innerHTML='<b>ROLLING</b><span>请双击同目录的「打开安卓演示.cmd」<br>即可自动启动并打开网页。</span>';}else{const s=document.createElement('script');s.src='flutter_bootstrap.js';document.body.appendChild(s);}
</script><script src="events.js"></script></body></html>
